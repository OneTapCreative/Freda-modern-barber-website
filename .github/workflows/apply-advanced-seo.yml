              '<section aria-labelledby="faq-title" class="section faq">': '<section aria-labelledby="faq-title" class="section faq" id="faq">',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f"Expected text not found: {old}")
